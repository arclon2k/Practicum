[tool.poetry]
name = "hm-tr-to-shopify"
version = "0.1.0"
description = "Export H&M Turkey products to Shopify-compatible CSV"
authors = ["Automation Bot <bot@example.com>"]
readme = "README.md"
packages = [{ include = "hm_tr_to_shopify" }]

[tool.poetry.dependencies]
python = "^3.11"
playwright = "^1.41"
httpx = "^0.24"
pydantic = "^1.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[tool.poetry.scripts]
hm_tr_to_shopify = "hm_tr_to_shopify.cli:main"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
